# Local overrides for this box. Keeps docker-compose.yml pristine so upstream
# pulls stay clean.
#
#   - restart "no": every server on this host is owned by systemd, not by the
#     docker daemon. See deploy/sparkdash.service.
#   - LLM_PORT: the compose file hardcodes 8888 (searxng holds it here); the
#     vLLM server on this box listens on 8890.
services:
  sparkdash:
    restart: "no"
    environment:
      - LLM_PORT=8890
